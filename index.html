<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Агро-Кадастр — Професійна ГІС Система</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #080c14; }
    
    /* Зсув системних кнопок Leaflet під верхню шапку */
    .leaflet-top.leaflet-right {
      top: 75px !important;
    }

    /* Темне скло для Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.96) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #f8fafc !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    
    .leaflet-popup-content {
      margin: 0 !important;
      width: 330px !important;
      max-width: 85vw !important;
      max-height: 60vh !important;
      overflow-y: auto !important;
      color: #f8fafc !important;
    }

    @media (max-width: 640px) {
      .leaflet-popup-content {
        width: 290px !important;
        max-width: 82vw !important;
        max-height: 52vh !important;
      }
    }

    .leaflet-popup-tip { 
      background: rgba(15, 23, 42, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    /* Стиль білого круга з чорним написом номера паю */
    .polygon-id-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .polygon-id-label::before {
      display: none !important;
    }
    .pai-number-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #000000;
      color: #000000;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      line-height: 1;
      user-select: none;
    }

    .custom-scroll::-webkit-scrollbar,
    .leaflet-popup-content::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track,
    .leaflet-popup-content::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb,
    .leaflet-popup-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950 text-slate-100">

  <!-- АВТОРИЗАЦІЯ -->
  <div id="login-modal" class="fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-cover bg-center" style="background-image: url('StockCake-Golden_Fields_Above-1530996-standard.jpg');">
    <div class="absolute inset-0 bg-slate-950/50 backdrop-blur-md"></div>
    <div class="relative z-10 bg-slate-900/85 border border-white/20 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl backdrop-blur-2xl">
      <div class="text-center mb-6 sm:mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 mb-3 sm:mb-4 border border-emerald-500/20 shadow-lg text-2xl">🔒</div>
        <h2 class="text-lg sm:text-xl font-bold text-slate-100 tracking-tight">ГІС Агро-Кадастр</h2>
        <p class="text-xs sm:text-sm text-slate-300 mt-1">Авторизуйтесь для роботи з масивом полів</p>
      </div>
      <div class="space-y-4 sm:space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Логін</label>
          <input type="text" id="auth-username" placeholder="admin або user" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 shadow-inner">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Пароль</label>
          <input type="password" id="auth-password" placeholder="••••" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 shadow-inner">
        </div>
        <div id="login-error" class="hidden text-xs text-rose-400 text-center font-medium bg-rose-500/10 py-2 rounded-lg border border-rose-500/20">Невірний логін або пароль!</div>
        <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition-all shadow-lg active:scale-95 mt-2">
          Увійти в систему
        </button>
      </div>
    </div>
  </div>

  <!-- КНОПКА ГЕОЛОКАЦІЇ -->
  <button onclick="locateUser()" title="Ваше місцерозташування" class="fixed right-4 bottom-6 sm:right-5 sm:bottom-8 z-[1000] bg-white hover:bg-slate-100 text-slate-700 w-11 h-11 sm:w-12 sm:h-12 rounded-full shadow-2xl border border-slate-200/80 flex items-center justify-center transition-all active:scale-90 group focus:outline-none">
    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-slate-600 group-hover:text-blue-600 transition-colors" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- ПАНЕЛЬ УПРАВЛІННЯ -->
  <aside id="sidebar" class="fixed top-2 left-2 right-2 sm:top-4 sm:left-4 sm:right-auto z-[1000] w-auto sm:w-[350px] bg-slate-900/90 backdrop-blur-2xl text-slate-200 rounded-2xl shadow-2xl border border-white/10 flex flex-col overflow-hidden transition-all duration-300">
    <div onclick="toggleSidebar()" class="p-3 sm:p-4 bg-slate-950/80 border-b border-white/10 flex items-center justify-between cursor-pointer select-none group">
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shadow-lg"></div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-xs sm:text-sm uppercase tracking-wider text-slate-50 group-hover:text-emerald-400 transition-colors">АГРО-КАДАСТР</h1>
            <svg id="sidebar-chevron" class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
          <p id="user-role-badge" class="text-[10px] sm:text-xs text-emerald-400/80 font-semibold">Гість</p>
        </div>
      </div>
      <button onclick="event.stopPropagation(); handleLogout()" class="text-[11px] sm:text-xs font-semibold bg-white/5 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg border border-white/10 transition-colors">
        Вийти
      </button>
    </div>

    <div id="sidebar-body" class="hidden flex flex-col max-h-[calc(100vh-120px)] transition-all duration-300">
      <!-- ПОШУК -->
      <div class="p-2.5 sm:p-3 bg-black/40 border-b border-white/5">
        <div class="relative flex items-center">
          <input type="text" id="search-input" placeholder="Cadnum, № паю, орендар..." 
                 onkeyup="if(event.key === 'Enter') performSearch()"
                 class="w-full bg-slate-950/90 border border-white/15 rounded-xl pl-8 pr-16 py-2 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500 shadow-inner">
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <button onclick="performSearch()" class="absolute right-1.5 text-[11px] bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-2 py-1 rounded-lg transition-colors">
            Шукати
          </button>
        </div>
      </div>

      <!-- АНАЛІТИКА -->
      <div class="grid grid-cols-2 gap-2 p-3 bg-black/20 border-b border-white/5 text-center">
        <div class="bg-slate-950/60 p-2 sm:p-2.5 rounded-xl border border-white/5">
          <span class="block text-[9px] uppercase font-bold text-slate-400 tracking-wider mb-0.5">Обрано</span>
          <span id="stat-count" class="text-base sm:text-lg font-extrabold text-slate-100">0</span>
        </div>
        <div class="bg-slate-950/60 p-2 sm:p-2.5 rounded-xl border border-white/5">
          <span class="block text-[9px] uppercase font-bold text-slate-400 tracking-wider mb-0.5">Площа</span>
          <span id="stat-area" class="text-base sm:text-lg font-extrabold text-emerald-400">0.00 га</span>
        </div>
      </div>

      <!-- ФІЛЬТРИ -->
      <div class="p-3 space-y-3 overflow-y-auto custom-scroll flex-1">
        
        <!-- Сезон сівозміни -->
        <div class="bg-slate-950/40 p-2.5 rounded-xl border border-white/5">
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5 tracking-wider">📅 Сезон сівозміни</label>
          <select id="global-year-select" onchange="onYearChange(this.value)" class="w-full bg-slate-900 border border-white/15 rounded-lg px-2.5 py-1.5 text-xs text-emerald-400 font-bold focus:outline-none focus:border-emerald-500 cursor-pointer">
            <option value="2026" selected>Сезон 2026</option>
            <option value="2025">Сезон 2025</option>
            <option value="2024">Сезон 2024</option>
            <option value="2023">Сезон 2023</option>
            <option value="2022">Сезон 2022</option>
          </select>
        </div>

        <!-- АКОРДЕОН: ОРЕНДАРІ -->
        <div class="border border-white/10 rounded-xl overflow-hidden bg-slate-950/40">
          <div onclick="toggleAccordion('tenant-acc')" class="w-full flex items-center justify-between p-2.5 bg-slate-900/80 cursor-pointer select-none hover:bg-slate-800">
            <span class="text-xs font-bold uppercase text-slate-300 tracking-wider">🏢 Орендарі</span>
            <div class="flex items-center gap-2">
              <button onclick="event.stopPropagation(); toggleGroup('tenant', true)" class="text-[10px] text-emerald-400 font-bold px-1.5 py-0.5 bg-emerald-500/10 rounded">Всі</button>
              <svg id="tenant-acc-chevron" class="w-4 h-4 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
          <div id="tenant-acc-body" class="p-2 space-y-1.5 max-h-40 overflow-y-auto custom-scroll border-t border-white/5">
            <div id="tenant-filters" class="space-y-1.5"></div>
          </div>
        </div>

        <!-- АКОРДЕОН: КУЛЬТУРИ -->
        <div class="border border-white/10 rounded-xl overflow-hidden bg-slate-950/40">
          <div onclick="toggleAccordion('crop-acc')" class="w-full flex items-center justify-between p-2.5 bg-slate-900/80 cursor-pointer select-none hover:bg-slate-800">
            <span class="text-xs font-bold uppercase text-slate-300 tracking-wider">🌾 Культури</span>
            <div class="flex items-center gap-2">
              <button onclick="event.stopPropagation(); toggleGroup('crop', true)" class="text-[10px] text-emerald-400 font-bold px-1.5 py-0.5 bg-emerald-500/10 rounded">Всі</button>
              <svg id="crop-acc-chevron" class="w-4 h-4 text-slate-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
          <div id="crop-acc-body" class="p-2 space-y-1.5 max-h-40 overflow-y-auto custom-scroll border-t border-white/5">
            <div id="crop-filters" class="space-y-1.5"></div>
          </div>
        </div>

      </div>
    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserRole = localStorage.getItem('user_role') || null;
    let currentSelectedYear = '2026';
    let userLocationMarker = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleSidebar() {
      document.getElementById('sidebar-body').classList.toggle('hidden');
      document.getElementById('sidebar-chevron').classList.toggle('rotate-180');
    }

    function toggleAccordion(id) {
      const body = document.getElementById(`${id}-body`);
      const chevron = document.getElementById(`${id}-chevron`);
      body.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    }

    function checkAuth() {
      if (!currentUserRole) {
        document.getElementById('login-modal').classList.remove('hidden');
      } else {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-role-badge').innerText = currentUserRole === 'admin' ? 'Адміністратор' : 'Переглядач';
      }
    }

    function handleLogin() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const err = document.getElementById('login-error');

      if (u === 'admin' && p === '8878') currentUserRole = 'admin';
      else if (u === 'user' && p === '1111') currentUserRole = 'user';
      else { err.classList.remove('hidden'); return; }

      err.classList.add('hidden');
      localStorage.setItem('user_role', currentUserRole);
      checkAuth();
      renderMap();
    }

    function handleLogout() {
      localStorage.removeItem('user_role');
      currentUserRole = null;
      checkAuth();
    }

    const map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      "Google Супутник": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    basemaps["Google Супутник"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    function locateUser() {
      if (!navigator.geolocation) return alert('Геолокація не підтримується');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (userLocationMarker) map.removeLayer(userLocationMarker);
        userLocationMarker = L.circleMarker([latitude, longitude], {
          radius: 8, fillColor: '#1A73E8', color: '#FFFFFF', weight: 3, opacity: 1, fillOpacity: 1
        }).addTo(map).bindPopup('<b>Ви тут</b>').openPopup();
        map.setView([latitude, longitude], 17);
      });
    }

    const cropColors = {
      'соняшник': '#E2A854',  
      'кукурудза': '#7A9A60',  
      'гречка': '#5E8C6A',     
      'помідор': '#C66858',    
      'малина': '#B85B74',     
      'пшениця': '#D9C583',    
      'просо': '#CBB778',      
      'батат': '#A8795A',      
      'ріпак': '#E0BD4E',      
      'соя': '#488B77'         
    };

    const tenantColors = {};
    const defaultPalette = ['#38BDF8', '#F472B6', '#34D399', '#FB923C', '#A78BFA', '#FBBF24', '#60A5FA'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#94A3B8';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      checkAuth();
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) return console.error('Помилка завантаження даних:', error);

      rawGeoJson = data;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function getFieldDataByYear(properties, year) {
      const crop = String(properties[`crop_${year}`] || properties.crop || 'інше').trim().toLowerCase();
      const tenant = String(properties[`tenant_${year}`] || properties.area_ha || properties.орендар || '—').trim();
      return { crop, tenant };
    }

    function rebuildFilterValues() {
      activeCrops.clear();
      activeTenants.clear();
      if (!rawGeoJson || !rawGeoJson.features) return;

      rawGeoJson.features.forEach(f => {
        const { crop, tenant } = getFieldDataByYear(f.properties, currentSelectedYear);
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });
    }

    function onYearChange(newYear) {
      currentSelectedYear = newYear;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');
      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const safeTenant = escapeHtml(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-1.5 rounded-lg bg-slate-950/60 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2 w-full overflow-hidden">
            <input type="checkbox" value="${safeTenant}" data-group="tenant" checked class="w-3.5 h-3.5 shrink-0 text-emerald-500 rounded bg-slate-900 border-white/20">
            <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${color}; box-shadow: 0 0 6px ${color};"></span>
            <span class="font-medium text-slate-200 truncate text-[11px]" title="${safeTenant}">${safeTenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#8B93A0';
        const safeCrop = escapeHtml(crop);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-1.5 rounded-lg bg-slate-950/60 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2">
            <input type="checkbox" value="${safeCrop}" data-group="crop" checked class="w-3.5 h-3.5 text-emerald-500 rounded bg-slate-900 border-white/20">
            <span class="w-2.5 h-2.5 rounded-sm" style="background-color: ${color};"></span>
            <span class="capitalize font-medium text-slate-200 text-[11px]">${safeCrop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => cb.addEventListener('change', syncFiltersAndRender));
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();
      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));
      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function performSearch() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      if (!query) return;

      let foundLayer = null;

      geojsonLayer.eachLayer(layer => {
        const p = layer.feature.properties;
        const cadnum = (p.cadnum || '').toString().toLowerCase();
        const id = (p.id || '').toString().toLowerCase();
        const owner = (p.owner || '').toString().toLowerCase();
        const tenant = (p.area_ha || '').toString().toLowerCase();

        if (cadnum.includes(query) || id === query || owner.includes(query) || tenant.includes(query)) {
          foundLayer = layer;
        }
      });

      if (foundLayer) {
        map.fitBounds(foundLayer.getBounds(), { maxZoom: 18, animate: true, padding: [50, 50] });
        foundLayer.openPopup();
      } else {
        alert('Ділянку не знайдено!');
      }
    }

    function updateLabelsVisibility() {
      if (!geojsonLayer) return;
      const currentZoom = map.getZoom();

      geojsonLayer.eachLayer(layer => {
        const p = layer.feature.properties;
        const paiId = p.id || '';

        if (currentZoom >= 15 && paiId !== '') {
          if (!layer.getTooltip()) {
            layer.bindTooltip(`
              <div class="pai-number-badge">
                ${paiId}
              </div>
            `, {
              permanent: true,
              direction: 'center',
              className: 'polygon-id-label'
            });
          }
        } else {
          if (layer.getTooltip()) {
            layer.unbindTooltip();
          }
        }
      });
    }

    map.on('zoomend', updateLabelsVisibility);

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const { tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          const strokeColor = getTenantColor(tenant);

          return {
            fillColor: strokeColor,
            fillOpacity: 0.4,
            color: strokeColor,
            weight: 2,
            opacity: 0.9
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;
          const areaNum = parseFloat(p.Площа) || parseFloat(p.area) || 0;
          totalArea += areaNum;

          layer.on({
            mouseover: (e) => { e.target.setStyle({ weight: 4, color: '#FFFFFF', fillOpacity: 0.65 }); },
            mouseout: (e) => { geojsonLayer.resetStyle(e.target); }
          });

          /* КРИТИЧНО: autoPanPaddingTopLeft упереджує накладання Popup на шапку */
          layer.bindPopup(() => getPopupHTML(p, areaNum), { 
            maxWidth: 340,
            autoPanPaddingTopLeft: [10, 90],
            autoPanPaddingBottomRight: [10, 20]
          });
        }
      }).addTo(map);

      updateLabelsVisibility();

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';
    }

    function selectPopupYear(e, fieldId, year) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const feature = rawGeoJson.features.find(f => (f.properties.id || '').toString() == fieldId.toString());
      if (feature && map._popup) {
        const areaNum = parseFloat(feature.properties.Площа) || parseFloat(feature.properties.area) || 0;
        const newHtml = getPopupHTML(feature.properties, areaNum, year);
        map._popup.setContent(newHtml);
      }
    }

    function getPopupHTML(p, areaNum, selectedYear = currentSelectedYear) {
      const cadnum = escapeHtml(p.cadnum || '—');
      const id = escapeHtml(p.id || 'б/н');
      const address = escapeHtml(p.address || 'Адреса не вказана');
      const owner = escapeHtml(p.owner || 'Не вказано');

      const { crop, tenant } = getFieldDataByYear(p, selectedYear);
      const strokeColor = getTenantColor(tenant);
      const cropColor = cropColors[crop] || '#8B93A0';
      const isAdmin = currentUserRole === 'admin';

      const yearsList = ['2022', '2023', '2024', '2025', '2026'];
      const cropColumnsHTML = yearsList.map(yr => {
        const yrData = getFieldDataByYear(p, yr);
        const yrCrop = yrData.crop;
        const yrColor = cropColors[yrCrop] || '#64748b';
        const isSelected = yr === selectedYear;

        return `
          <div onclick="selectPopupYear(event, '${id}', '${yr}')" style="
            flex: 1; 
            background: ${isSelected ? 'rgba(16, 185, 129, 0.25)' : 'rgba(0,0,0,0.4)'}; 
            border: 1px solid ${isSelected ? '#10b981' : 'rgba(255,255,255,0.1)'}; 
            border-radius: 6px; 
            padding: 4px 1px; 
            text-align: center; 
            cursor: pointer;
          ">
            <div style="font-size: 8px; font-weight: 800; color: ${isSelected ? '#34d399' : '#94a3b8'}; margin-bottom: 2px;">${yr}</div>
            <div style="
              font-size: 8px; 
              font-weight: 700; 
              color: #ffffff; 
              background: ${yrColor}; 
              padding: 2px 1px; 
              border-radius: 3px; 
              text-transform: capitalize;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
            " title="${escapeHtml(yrCrop)}">${escapeHtml(yrCrop)}</div>
          </div>
        `;
      }).join('');

      return `
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;" onclick="event.stopPropagation()">
          
          <!-- 1. КАДАСТРОВИЙ НОМЕР -->
          <div style="background: rgba(255,255,255,0.06); padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <div style="font-size: 8px; font-weight: 800; color: #94a3b8; text-transform: uppercase;">Кадастровий номер</div>
            <div style="font-weight: 800; font-size: 11px; color: #38bdf8; font-family: monospace; margin-top: 1px; word-break: break-all;">${cadnum}</div>
          </div>

          <!-- 2. НОМЕР ПАЮ -->
          <div style="padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2);">
            <div style="font-size: 10px; font-weight: 700; color: #94a3b8;">Номер паю:</div>
            <span style="background: #10b981; color: #022c22; font-weight: 800; font-size: 11px; padding: 1px 8px; border-radius: 5px;">Пай № ${id}</span>
          </div>

          <!-- ТІЛО СПЛИВАЮЧОГО ВІКНА -->
          <div style="padding: 10px 12px; font-size: 11px; line-height: 1.4; color: #cbd5e1;">
            
            <!-- 3. Орендар -->
            <div style="margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
              <div style="color: #94a3b8; font-weight: 500; font-size: 10px; margin-bottom: 2px;">Орендар:</div>
              ${isAdmin ? `
                <textarea id="edit-tenant-${id}" rows="2" onclick="event.stopPropagation()" style="width: 100%; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; border-radius: 6px; padding: 4px 6px; resize: vertical; font-family: inherit;">${escapeHtml(tenant)}</textarea>
              ` : `
                <div style="font-weight: 700; color: #f8fafc; font-size: 11px; word-break: break-word; display: flex; align-items: flex-start; gap: 6px;">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block; flex-shrink: 0; margin-top: 3px; box-shadow: 0 0 6px${strokeColor};"></span>
                  <span>${escapeHtml(tenant)}</span>
                </div>
              `}
            </div>

            <!-- 4. Площа -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
              <span style="color: #94a3b8; font-weight: 500;">Площа:</span>
              <span style="font-weight: 800; color: #34d399; font-size: 12px;">${areaNum.toFixed(4)} га</span>
            </div>

            <!-- 5. Адреса -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
              <span style="color: #94a3b8; font-weight: 500; min-width: 65px;">Адреса:</span>
              <span style="font-weight: 500; color: #e2e8f0; text-align: right; font-size: 10px;">${address}</span>
            </div>

            <!-- 6. Культура -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
              <span style="color: #94a3b8; font-weight: 500;">Культура (${selectedYear}):</span>
              ${isAdmin ? `
                <input id="edit-crop-${id}" type="text" value="${escapeHtml(crop)}" onclick="event.stopPropagation()" style="width: 120px; text-align: right; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; border-radius: 5px; padding: 2px 5px;">
              ` : `
                <span style="font-weight: 700; color: #f8fafc; text-transform: capitalize; background: ${cropColor}30; border: 1px solid ${cropColor}80; padding: 1px 6px; border-radius: 5px; font-size: 10px;">${escapeHtml(crop)}</span>
              `}
            </div>

            <!-- 7. Власник -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px;">
              <span style="color: #94a3b8; font-weight: 500; min-width: 65px;">Власник:</span>
              <span style="font-weight: 700; color: #f8fafc; text-align: right; font-size: 10px;">${owner}</span>
            </div>

            <!-- ІСТОРІЯ СІВОЗМІНИ -->
            <div style="margin-top: 8px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">
              <div style="font-size: 8px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; text-align: center;">🌾 Сівозміна (Клікніть рік)</div>
              <div style="display: flex; gap: 3px;">
                ${cropColumnsHTML}
              </div>
            </div>

            ${isAdmin ? `
              <button onclick="saveFieldEdits(event, '${id}', '${selectedYear}')" style="width: 100%; margin-top: 8px; background: #10b981; color: #022c22; border: none; padding: 7px; border-radius: 7px; font-weight: 800; font-size: 10px; cursor: pointer;">
                💾 Зберегти зміни (${selectedYear})
              </button>
            ` : ''}

          </div>
        </div>
      `;
    }

    async function saveFieldEdits(e, id, year) {
      if (e) e.stopPropagation();

      const newTenant = document.getElementById(`edit-tenant-${id}`).value.trim();
      const newCrop = document.getElementById(`edit-crop-${id}`).value.trim();

      const feature = rawGeoJson.features.find(f => (f.properties.id || '').toString() == id.toString());
      if (!feature) return;

      const updateData = {};
      if (year === '2026') {
        updateData.crop = newCrop;
        updateData.area_ha = newTenant;
      } else {
        updateData[`crop_${year}`] = newCrop;
        updateData[`tenant_${year}`] = newTenant;
      }

      const { error } = await supabaseClient.from('fields').update(updateData).eq('id', id);

      if (error) {
        alert('Помилка збереження: ' + error.message);
      } else {
        alert('Зміни успішно збережено!');
        if (year === '2026') {
          feature.properties.crop = newCrop;
          feature.properties.area_ha = newTenant;
        } else {
          feature.properties[`crop_${year}`] = newCrop;
          feature.properties[`tenant_${year}`] = newTenant;
        }
        rebuildFilterValues();
        renderControls();
        renderMap();
      }
    }

    initApp();
  </script>
</body>
</html>
