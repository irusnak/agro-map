<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Агро-Кадастр — Панель Адміністратора</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS (Інтерактивна карта) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    #map { height: calc(100vh - 60px); width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-[#0b1017] text-white font-sans antialiased overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Початкові дані для ділянки
    const initialPlotData = {
      cadastralNumber: "3221485500:01:001:0048",
      plotNumber: "Пай № б/н",
      tenant: "—",
      area: "0.5845 га",
      address: "Адреса не вказана",
      owner: "Магаляс Іван Володимирович",
      cropHistory: {
        2022: "Гречка",
        2023: "Гречка",
        2024: "Гречка",
        2025: "Гречка",
        2026: "Гречка"
      }
    };

    function App() {
      // Стан авторизації (за замовчуванням Admin)
      const [isAdmin, setIsAdmin] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(true);
      const [selectedYear, setSelectedYear] = useState(2026);
      const [statusMessage, setStatusMessage] = useState("");
      
      // Стан даних ділянки (завантажуємо з localStorage або початкових)
      const [plot, setPlot] = useState(() => {
        const saved = localStorage.getItem("current_plot_data");
        return saved ? JSON.parse(saved) : initialPlotData;
      });

      // Ініціалізація Leaflet карти
      useEffect(() => {
        const map = L.map('map').setView([48.4500, 25.9300], 15);

        // Супутниковий шар Esri World Imagery
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Приклад полігону ділянки
        const polygon = L.polygon([
          [48.4520, 25.9280],
          [48.4530, 25.9320],
          [48.4510, 25.9340],
          [48.4500, 25.9290]
        ], { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.35 }).addTo(map);

        polygon.on('click', () => {
          setIsModalOpen(true);
        });

        return () => map.remove();
      }, []);

      // Оновлення текстових полів
      const handleFieldChange = (field, value) => {
        setPlot(prev => ({
          ...prev,
          [field]: value
        }));
      };

      // Оновлення культури для вибраного року
      const handleCropChange = (value) => {
        setPlot(prev => ({
          ...prev,
          cropHistory: {
            ...prev.cropHistory,
            [selectedYear]: value
          }
        }));
      };

      // Збереження даних
      const handleSave = (e) => {
        e.preventDefault();
        if (!isAdmin) {
          setStatusMessage("Помилка: Увійдіть під обліковим записом admin!");
          return;
        }

        // Зберігаємо в локальну пам'ять
        localStorage.setItem("current_plot_data", JSON.stringify(plot));
        
        setStatusMessage("Успішно збережено всі зміни!");
        setTimeout(() => setStatusMessage(""), 3000);
      };

      const yearsList = [2022, 2023, 2024, 2025, 2026];

      return (
        <div className="relative h-screen w-screen flex flex-col">
          
          {/* ВЕРХНЯ ПАНЕЛЬ (HEADER) */}
          <header className="h-[60px] bg-[#121a24] border-b border-slate-800 px-6 flex items-center justify-between z-10 shadow-md">
            <div className="flex items-center gap-3">
              <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
              <div>
                <h1 className="font-bold text-sm tracking-wide text-white uppercase flex items-center gap-1">
                  АГРО-КАДАСТР <span className="text-xs text-slate-400">⌄</span>
                </h1>
                <p className="text-[11px] text-slate-400">
                  {isAdmin ? "Адміністратор (Повний доступ)" : "Гість (Перегляд)"}
                </p>
              </div>
            </div>

            <button
              onClick={() => setIsAdmin(!isAdmin)}
              className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
                isAdmin 
                  ? "bg-slate-700 hover:bg-slate-600 text-white" 
                  : "bg-emerald-600 hover:bg-emerald-500 text-white"
              }`}
            >
              {isAdmin ? "Вийти" : "Увійти як Admin"}
            </button>
          </header>

          {/* КАРТА */}
          <div id="map" className="flex-1"></div>

          {/* СПЛИВАЮЧЕ ВІКНО (POPUP MODAL) */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4">
              <div className="w-full max-w-md rounded-xl border border-slate-700 bg-[#141d26] text-white shadow-2xl overflow-hidden">
                
                {/* Заголовок модалки */}
                <div className="flex items-center justify-between border-b border-slate-700 bg-[#1c2733] px-5 py-3">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-slate-300">
                    {plot.cadastralNumber}
                  </h2>
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="text-xl font-bold leading-none text-slate-400 hover:text-white transition-colors"
                  >
                    &times;
                  </button>
                </div>

                {/* Форма редагування */}
                <form onSubmit={handleSave} className="space-y-3 p-5 text-sm">
                  
                  {/* Номер паю */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">Номер паю:</label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.plotNumber}
                        onChange={(e) => handleFieldChange('plotNumber', e.target.value)}
                        className="w-1/2 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right font-semibold text-emerald-400 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="rounded bg-[#0c1219] px-3 py-1 font-semibold text-emerald-400">
                        {plot.plotNumber}
                      </span>
                    )}
                  </div>

                  {/* Орендар */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">Орендар:</label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.tenant}
                        onChange={(e) => handleFieldChange('tenant', e.target.value)}
                        className="w-3/5 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="text-slate-200">{plot.tenant}</span>
                    )}
                  </div>

                  {/* Площа */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">Площа:</label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.area}
                        onChange={(e) => handleFieldChange('area', e.target.value)}
                        className="w-1/2 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="text-slate-200">{plot.area}</span>
                    )}
                  </div>

                  {/* Адреса */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">Адреса:</label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.address}
                        onChange={(e) => handleFieldChange('address', e.target.value)}
                        className="w-3/5 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right text-slate-200 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="text-slate-200">{plot.address}</span>
                    )}
                  </div>

                  {/* Культура за вибраний рік */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">
                      Культури({selectedYear}):
                    </label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.cropHistory[selectedYear] || ''}
                        onChange={(e) => handleCropChange(e.target.value)}
                        className="w-1/2 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right font-medium text-slate-100 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="font-medium text-slate-200">
                        {plot.cropHistory[selectedYear] || '—'}
                      </span>
                    )}
                  </div>

                  {/* Власник */}
                  <div className="flex items-center justify-between gap-2">
                    <label className="text-slate-400 font-medium">Власник:</label>
                    {isAdmin ? (
                      <input
                        type="text"
                        value={plot.owner}
                        onChange={(e) => handleFieldChange('owner', e.target.value)}
                        className="w-3/5 rounded border border-slate-600 bg-[#0c1219] px-3 py-1 text-right font-medium text-slate-100 focus:border-emerald-500 focus:outline-none"
                      />
                    ) : (
                      <span className="font-medium text-slate-200">{plot.owner}</span>
                    )}
                  </div>

                  {/* Блок ІСТОРІЯ СІВОЗМІН */}
                  <div className="mt-3 border-t border-slate-800 pt-3">
                    <div className="mb-2 text-center text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center justify-center gap-1">
                      <span>⚡</span> ІСТОРІЯ СІВОЗМІН
                    </div>

                    <div className="grid grid-cols-5 gap-1.5">
                      {yearsList.map((year) => {
                        const isActive = selectedYear === year;
                        return (
                          <button
                            key={year}
                            type="button"
                            onClick={() => setSelectedYear(year)}
                            className={`flex flex-col items-center justify-center rounded border py-1.5 px-1 text-xs transition-all ${
                              isActive
                                ? 'border-emerald-400 bg-emerald-600 font-bold text-white shadow-lg scale-105'
                                : 'border-slate-700 bg-[#1a2533] text-slate-300 hover:bg-slate-700'
                            }`}
                          >
                            <span className="text-[10px] opacity-75">{year}</span>
                            <span className="w-full truncate text-center text-[11px]">
                              {plot.cropHistory[year] || '—'}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Повідомлення про статус */}
                  {statusMessage && (
                    <div className="mt-2 rounded border border-emerald-700 bg-emerald-950/80 py-1.5 px-3 text-center text-xs text-emerald-400">
                      {statusMessage}
                    </div>
                  )}

                  {/* Кнопка збереження */}
                  {isAdmin && (
                    <div className="pt-2">
                      <button
                        type="submit"
                        className="w-full rounded-lg bg-emerald-500 py-2.5 font-bold text-slate-950 shadow-lg hover:bg-emerald-400 active:scale-98 transition-all"
                      >
                        💾 Зберегти зміни ({selectedYear})
                      </button>
                    </div>
                  )}

                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
