<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Агро-Кадастр — Професійна ГІС Система</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #080c14; }
    
    /* Темне скло для Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.92) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      color: #f8fafc !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 300px !important;
      max-width: 85vw !important;
      color: #f8fafc !important;
    }
    .leaflet-popup-tip { 
      background: rgba(15, 23, 42, 0.92) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    /* Ефекти для полігонів */
    .agro-field-polygon {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.7));
      cursor: pointer;
    }
    .agro-field-polygon:hover {
      filter: drop-shadow(0px 0px 16px rgba(255, 255, 255, 0.9));
    }

    /* Скроллбар */
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950 text-slate-100">

  <!-- Контейнер для SVG-патернів (штрихування культур на карті) -->
  <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
    <defs id="svg-patterns"></defs>
  </svg>

  <!-- ВІКНО АВТОРИЗАЦІЇ З ФОНОМ -->
  <div id="login-modal" class="fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-cover bg-center" style="background-image: url('StockCake-Golden_Fields_Above-1530996-standard.jpg');">
    
    <!-- Розмиття та затемнення фону -->
    <div class="absolute inset-0 bg-slate-950/50 backdrop-blur-md"></div>
    
    <!-- Форма входу -->
    <div class="relative z-10 bg-slate-900/85 border border-white/20 rounded-2xl p-8 w-full max-w-md shadow-2xl backdrop-blur-2xl">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-500/10 text-emerald-400 mb-4 border border-emerald-500/20 shadow-lg shadow-emerald-500/10 text-2xl">
          🔒
        </div>
        <h2 class="text-xl font-bold text-slate-100 tracking-tight">ГІС Агро-Кадастр</h2>
        <p class="text-sm text-slate-300 mt-2">Авторизуйтесь для роботи з масивом полів</p>
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Логін</label>
          <input type="text" id="auth-username" placeholder="admin або user" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors shadow-inner">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Пароль</label>
          <input type="password" id="auth-password" placeholder="••••" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors shadow-inner">
        </div>
        <div id="login-error" class="hidden text-sm text-rose-400 text-center font-medium bg-rose-500/10 py-2 rounded-lg border border-rose-500/20">Невірний логін або пароль!</div>
        <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-500/20 active:scale-95 mt-2">
          Увійти в систему
        </button>
      </div>
    </div>
  </div>

  <!-- КНОПКА ГЕОЛОКАЦІЇ -->
  <button onclick="locateUser()" title="Ваше місцерозташування" class="fixed right-5 bottom-8 z-[1000] bg-white hover:bg-slate-100 text-slate-700 w-12 h-12 rounded-full shadow-2xl border border-slate-200/80 flex items-center justify-center transition-all active:scale-90 group focus:outline-none">
    <svg class="w-6 h-6 text-slate-600 group-hover:text-blue-600 transition-colors" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Інтерактивна Панель управління (Збільшено для професійного вигляду) -->
  <aside id="sidebar" class="fixed top-4 left-4 z-[1000] w-[calc(100vw-32px)] max-w-sm md:w-[360px] bg-slate-900/90 backdrop-blur-2xl text-slate-200 rounded-2xl shadow-2xl border border-white/10 flex flex-col overflow-hidden transition-all duration-300">
    
    <!-- Шапка -->
    <div onclick="toggleSidebar()" class="p-4 bg-slate-950/80 border-b border-white/10 flex items-center justify-between cursor-pointer select-none hover:bg-slate-900 transition-colors group">
      <div class="flex items-center gap-3.5">
        <div class="w-3 h-3 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shadow-lg shadow-emerald-500/50"></div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-sm uppercase tracking-wider text-slate-50 group-hover:text-emerald-400 transition-colors">АГРО-КАДАСТР</h1>
            <svg id="sidebar-chevron" class="w-4 h-4 text-slate-400 group-hover:text-emerald-400 transition-transform duration-300 rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
          <p id="user-role-badge" class="text-xs text-emerald-400/80 font-semibold mt-0.5">Гість</p>
        </div>
      </div>
      <button onclick="event.stopPropagation(); handleLogout()" class="text-xs font-semibold bg-white/5 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 px-3 py-1.5 rounded-lg border border-white/10 hover:border-rose-500/30 transition-colors">
        Вийти
      </button>
    </div>

    <!-- Тіло панелі -->
    <div id="sidebar-body" class="flex flex-col max-h-[calc(100vh-140px)] transition-all duration-300">
      
      <!-- Аналітичні метрики -->
      <div class="grid grid-cols-2 gap-3 p-4 bg-black/20 border-b border-white/5 text-center">
        <div class="bg-slate-950/60 p-3 rounded-xl border border-white/5 shadow-inner">
          <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Обрано ділянок</span>
          <span id="stat-count" class="text-xl font-extrabold text-slate-100">0</span>
        </div>
        <div class="bg-slate-950/60 p-3 rounded-xl border border-white/5 shadow-inner">
          <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1">Загальна площа</span>
          <span id="stat-area" class="text-xl font-extrabold text-emerald-400">0.00 га</span>
        </div>
      </div>

      <!-- Фільтри -->
      <div class="p-4 space-y-5 overflow-y-auto custom-scroll flex-1">
        
        <!-- Селектор року -->
        <div class="bg-slate-950/40 p-3.5 rounded-xl border border-white/5">
          <label class="block text-xs font-bold uppercase text-slate-400 mb-2.5 tracking-wider">📅 Сезон сівозміни</label>
          <select id="global-year-select" onchange="onYearChange(this.value)" class="w-full bg-slate-900 border border-white/15 rounded-lg px-4 py-2.5 text-sm text-emerald-400 font-bold focus:outline-none focus:border-emerald-500/60 transition-colors shadow-sm cursor-pointer">
            <option value="2024" selected>Сезон 2024</option>
            <option value="2023">Сезон 2023</option>
            <option value="2022">Сезон 2022</option>
          </select>
        </div>

        <!-- Культури -->
        <div>
          <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">🌾 Культури</span>
            <button onclick="toggleGroup('crop', true)" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1 bg-emerald-500/10 rounded-md transition-colors">Всі</button>
          </div>
          <div id="crop-filters" class="space-y-2"></div>
        </div>

        <div class="border-t border-white/5"></div>

        <!-- Орендарі -->
        <div>
          <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">👤 Орендарі</span>
            <button onclick="toggleGroup('tenant', true)" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold px-2 py-1 bg-emerald-500/10 rounded-md transition-colors">Всі</button>
          </div>
          <div id="tenant-filters" class="space-y-2"></div>
        </div>

      </div>
    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserRole = localStorage.getItem('user_role') || null;
    let currentSelectedYear = '2024';
    let userLocationMarker = null;

    function toggleSidebar() {
      const body = document.getElementById('sidebar-body');
      const chevron = document.getElementById('sidebar-chevron');
      body.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    }

    function checkAuth() {
      if (!currentUserRole) {
        document.getElementById('login-modal').classList.remove('hidden');
      } else {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-role-badge').innerText = currentUserRole === 'admin' ? 'Адміністратор' : 'Користувач (Перегляд)';
      }
    }

    function handleLogin() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const err = document.getElementById('login-error');

      if (u === 'admin' && p === '8878') {
        currentUserRole = 'admin';
      } else if (u === 'user' && p === '1111') {
        currentUserRole = 'user';
      } else {
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      localStorage.setItem('user_role', currentUserRole);
      checkAuth();
      renderMap();
    }

    function handleLogout() {
      localStorage.removeItem('user_role');
      currentUserRole = null;
      checkAuth();
    }

    const map = L.map('map', { zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      "Google Супутник": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    basemaps["Google Супутник"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    function locateUser() {
      if (!navigator.geolocation) {
        alert('Геолокація не підтримується вашим браузером');
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (userLocationMarker) map.removeLayer(userLocationMarker);

        userLocationMarker = L.circleMarker([latitude, longitude], {
          radius: 8, fillColor: '#1A73E8', color: '#FFFFFF', weight: 3, opacity: 1, fillOpacity: 1
        }).addTo(map).bindPopup('<b style="color:#0f172a;">Ви тут</b>').openPopup();

        map.setView([latitude, longitude], 17);
      }, (err) => {
        alert('Не вдалося отримати геопозицію.');
      }, { enableHighAccuracy: true });
    }

    // Палітра кольорів
    const cropColors = {
      'соняшник': '#E2A854',  
      'кукурудза': '#7A9A60',  
      'гречка': '#5E8C6A',     
      'помідор': '#C66858',    
      'малина': '#B85B74',     
      'пшениця': '#D9C583',    
      'просо': '#CBB778',      
      'батат': '#A8795A',      
      'ріпак': '#E0BD4E',      
      'соя': '#488B77'         
    };

    const tenantColors = { 'Іван': '#60A5FA', 'Петро': '#F472B6', 'Василь': '#34D399', 'Назар': '#FB923C' };
    const defaultPalette = ['#818CF8', '#38BDF8', '#34D399', '#FBBF24', '#F87171', '#A78BFA'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#94A3B8';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    // ГЕНЕРАЦІЯ SVG-ПАТЕРНІВ ДЛЯ ШТРИХУВАННЯ
    function generateSVGPatterns() {
      const defs = document.getElementById('svg-patterns');
      defs.innerHTML = ''; // Очищаємо перед генерацією

      Object.entries(cropColors).forEach(([crop, color]) => {
        const safeId = crop.replace(/\s+/g, '-');
        
        // Створюємо елемент pattern (Штрихування під кутом)
        const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
        pattern.setAttribute('id', `stripe-${safeId}`);
        pattern.setAttribute('patternUnits', 'userSpaceOnUse');
        pattern.setAttribute('width', '12');
        pattern.setAttribute('height', '12');
        pattern.setAttribute('patternTransform', 'rotate(45)');

        // Напівпрозорий фон кольору культури
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '12');
        bg.setAttribute('height', '12');
        bg.setAttribute('fill', color);
        bg.setAttribute('fill-opacity', '0.25'); 

        // Яскрава смужка
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', '0');
        line.setAttribute('y1', '0');
        line.setAttribute('x2', '0');
        line.setAttribute('y2', '12');
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', '4');
        line.setAttribute('stroke-opacity', '0.8');

        pattern.appendChild(bg);
        pattern.appendChild(line);
        defs.appendChild(pattern);
      });
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      generateSVGPatterns();
      checkAuth();
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) return console.error('Помилка завантаження даних:', error);

      rawGeoJson = data;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function getFieldDataByYear(properties, year) {
      const crop = (properties[`crop_${year}`] || properties.crop || 'інше').toLowerCase().trim();
      const tenant = (properties[`tenant_${year}`] || properties.area_ha || properties.орендар || '—').trim();
      return { crop, tenant };
    }

    function rebuildFilterValues() {
      activeCrops.clear();
      activeTenants.clear();
      rawGeoJson.features.forEach(f => {
        const { crop, tenant } = getFieldDataByYear(f.properties, currentSelectedYear);
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });
    }

    function onYearChange(newYear) {
      currentSelectedYear = newYear;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');
      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#8B93A0';
        // CSS-градієнт для імітації штрихування у легенді
        const stripeBg = `repeating-linear-gradient(45deg, ${color}40, ${color}40 3px, ${color}CC 3px, ${color}CC 6px)`;
        
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-950/50 hover:bg-white/5 border border-white/5 cursor-pointer text-sm transition-all group';
        label.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" value="${crop}" data-group="crop" checked class="w-5 h-5 text-emerald-500 rounded bg-slate-900 border-white/20 focus:ring-0 focus:ring-offset-0 cursor-pointer">
            <span class="w-5 h-5 rounded-md transition-transform group-hover:scale-105 border border-white/20 shadow-sm" style="background: ${stripeBg};"></span>
            <span class="capitalize font-medium text-slate-200">${crop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-950/50 hover:bg-white/5 border border-white/5 cursor-pointer text-sm transition-all group';
        label.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" value="${tenant}" data-group="tenant" checked class="w-5 h-5 text-emerald-500 rounded bg-slate-900 border-white/20 focus:ring-0 focus:ring-offset-0 cursor-pointer">
            <span class="w-5 h-1.5 rounded-full transition-transform group-hover:scale-110" style="background-color: ${color}; box-shadow: 0 0 8px ${color}80;"></span>
            <span class="font-medium text-slate-200">${tenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => cb.addEventListener('change', syncFiltersAndRender));
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();
      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));
      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          const safeId = crop.replace(/\s+/g, '-');
          
          // Використовуємо згенерований SVG-патерн, якщо є колір, інакше суцільний сірий
          const fillStyle = cropColors[crop] ? `url(#stripe-${safeId})` : '#8B93A0';
          const strokeColor = getTenantColor(tenant);

          return {
            fillColor: fillStyle,
            fillOpacity: 1, // Прозорість вже задана всередині SVG-патерна
            color: strokeColor,
            weight: 2,
            opacity: 1,
            className: 'agro-field-polygon'
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;
          const fieldId = p.id || 'б/н';
          const areaNum = parseFloat(p.Площа) || 0;
          totalArea += areaNum;

          layer.on({
            mouseover: (e) => { 
              e.target.setStyle({ weight: 4, color: '#FFFFFF' }); 
            },
            mouseout: (e) => { 
              geojsonLayer.resetStyle(e.target); 
            }
          });

          layer.bindPopup(() => getPopupHTML(p, fieldId, areaNum), { maxWidth: 320 });
        }
      }).addTo(map);

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';
    }

    function getPopupHTML(properties, fieldId, areaNum, selectedYear = currentSelectedYear) {
      const { crop, tenant } = getFieldDataByYear(properties, selectedYear);
      const strokeColor = getTenantColor(tenant);
      const cropColor = cropColors[crop] || '#8B93A0';
      const isAdmin = currentUserRole === 'admin';

      return `
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
          <div style="background: rgba(255,255,255,0.05); padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 800; font-size: 13px; tracking: 0.05em; color: #f8fafc;">ДІЛЯНКА № ${fieldId}</span>
            <span style="background: repeating-linear-gradient(45deg, ${cropColor}80, ${cropColor}80 3px, ${cropColor} 3px, ${cropColor} 6px); color: #ffffff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: capitalize; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 12px ${cropColor}60;">
              ${crop}
            </span>
          </div>

          <div style="padding: 16px; font-size: 13px; line-height: 1.6; color: #cbd5e1;">
            
            <div style="margin-bottom: 12px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);">
              <label style="font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 6px;">Сезон сівозміни:</label>
              <select onchange="updatePopupYear(this, '${fieldId}')" style="width: 100%; font-weight: 700; font-size: 13px; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: #0f172a; color: #34d399; outline: none; cursor: pointer;">
                <option value="2024" ${selectedYear === '2024' ? 'selected' : ''}>2024 рік</option>
                <option value="2023" ${selectedYear === '2023' ? 'selected' : ''}>2023 рік</option>
                <option value="2022" ${selectedYear === '2022' ? 'selected' : ''}>2022 рік</option>
              </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500;">Орендар:</span>
              ${isAdmin ? `
                <input id="edit-tenant-${fieldId}" type="text" value="${tenant}" style="width: 130px; text-align: right; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; border-radius: 6px; padding: 4px 6px; outline: none;">
              ` : `
                <span style="font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 6px;">
                  <span style="width: 10px; height: 10px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block; box-shadow: 0 0 8px${strokeColor}; border: 1px solid rgba(255,255,255,0.5);"></span>
                  ${tenant}
                </span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px;">
              <span style="color: #94a3b8; font-weight: 500;">Культура:</span>
              ${isAdmin ? `
                <input id="edit-crop-${fieldId}" type="text" value="${crop}" style="width: 130px; text-align: right; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; border-radius: 6px; padding: 4px 6px; outline: none;">
              ` : `
                <span style="font-weight: 700; color: #f8fafc; text-transform: capitalize;">${crop}</span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <span style="color: #94a3b8; font-weight: 500;">Площа:</span>
              <span style="font-weight: 800; color: #34d399; font-size: 14px;">${areaNum.toFixed(4)} га</span>
            </div>

            ${isAdmin ? `
              <button onclick="saveFieldEdits('${fieldId}', '${selectedYear}')" style="width: 100%; background: #10b981; color: #022c22; border: none; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">
                💾 Зберегти зміни
              </button>
            ` : ''}

          </div>
        </div>
      `;
    }

    function updatePopupYear(selectEl, fieldId) {
      const selectedYear = selectEl.value;
      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (feature) {
        const areaNum = parseFloat(feature.properties.Площа) || 0;
        const popup = selectEl.closest('.leaflet-popup-content');
        popup.innerHTML = getPopupHTML(feature.properties, fieldId, areaNum, selectedYear);
      }
    }

    async function saveFieldEdits(fieldId, year) {
      const newTenant = document.getElementById(`edit-tenant-${fieldId}`).value.trim();
      const newCrop = document.getElementById(`edit-crop-${fieldId}`).value.trim();

      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (!feature) return;

      const updateData = {};
      if (year === '2024') {
        updateData.crop = newCrop;
        updateData.area_ha = newTenant;
      } else {
        updateData[`crop_${year}`] = newCrop;
        updateData[`tenant_${year}`] = newTenant;
      }

      const { error } = await supabaseClient.from('fields').update(updateData).eq('id', fieldId);

      if (error) {
        alert('Помилка збереження: ' + error.message);
      } else {
        alert('Зміни успішно збережено!');
        if (year === '2024') {
          feature.properties.crop = newCrop;
          feature.properties.area_ha = newTenant;
        } else {
          feature.properties[`crop_${year}`] = newCrop;
          feature.properties[`tenant_${year}`] = newTenant;
        }
        rebuildFilterValues();
        renderControls();
        renderMap();
      }
    }

    initApp();
  </script>
</body>
</html>
