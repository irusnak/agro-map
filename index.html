<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Агро-Кадастр — Професійна ГІС Система</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #080c14; }
    
    /* Темне скло для Popup у стилі професійних ГІС */
    .leaflet-popup-content-wrapper {
      background: rgba(15, 23, 42, 0.88) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      color: #f8fafc !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 270px !important;
      max-width: 85vw !important;
      color: #f8fafc !important;
    }
    .leaflet-popup-tip { 
      background: rgba(15, 23, 42, 0.88) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }

    /* Візуальні ефекти об'єму та затемнення країв для ділянок */
    .agro-field-polygon {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      filter: drop-shadow(0px 3px 8px rgba(0, 0, 0, 0.65));
      cursor: pointer;
    }
    .agro-field-polygon:hover {
      filter: drop-shadow(0px 0px 14px rgba(255, 255, 255, 0.85));
    }

    /* Кастомний скроллбар */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950 text-slate-100">

  <!-- ВІКНО АВТОРИЗАЦІЇ -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-xl z-[3000] flex items-center justify-center p-4">
    <div class="bg-slate-900/90 border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl backdrop-blur-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20 shadow-lg shadow-emerald-500/10">
          🔒
        </div>
        <h2 class="text-lg font-bold text-slate-100 tracking-tight">Вхід у ГІС Агро-Кадастр</h2>
        <p class="text-xs text-slate-400 mt-1">Авторизуйтесь для роботи з масивом полів</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Логін</label>
          <input type="text" id="auth-username" placeholder="admin або user" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Пароль</label>
          <input type="password" id="auth-password" placeholder="••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
        <div id="login-error" class="hidden text-xs text-rose-400 text-center font-medium">Невірний логін або пароль!</div>
        <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
          Увійти в систему
        </button>
      </div>
    </div>
  </div>

  <!-- Кнопка мобільної панелі -->
  <button id="mobile-toggle-btn" onclick="toggleSidebar()" class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900/90 text-emerald-400 border border-emerald-500/30 backdrop-blur-xl px-5 py-2.5 rounded-full shadow-2xl font-semibold text-xs flex items-center gap-2 active:scale-95 transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
    <span>Панель управління</span>
  </button>

  <!-- КНОПКА ГЕОЛОКАЦІЇ У СТИЛІ GOOGLE MAPS (СПРАВА ЗНИЗУ) -->
  <button onclick="locateUser()" title="Ваше місцерозташування" class="fixed right-4 bottom-8 z-[1000] bg-white hover:bg-slate-100 text-slate-700 w-11 h-11 rounded-full shadow-2xl border border-slate-200/80 flex items-center justify-center transition-all active:scale-90 group focus:outline-none">
    <svg class="w-6 h-6 text-slate-600 group-hover:text-blue-600 transition-colors" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Професійна Панель управління (Glassmorphism UI) -->
  <aside id="sidebar" class="fixed inset-x-2 bottom-0 max-h-[80vh] md:inset-auto md:top-4 md:left-4 z-[1000] md:w-80 md:max-h-[calc(100vh-32px)] bg-slate-900/80 backdrop-blur-xl text-slate-200 rounded-t-2xl md:rounded-2xl shadow-2xl border border-white/10 flex flex-col overflow-hidden transition-transform duration-300 translate-y-full md:translate-y-0">
    
    <!-- Шапка -->
    <div class="p-4 bg-slate-950/60 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 ring-4 ring-emerald-500/20 shadow-lg shadow-emerald-500/50"></div>
        <div>
          <h1 class="font-extrabold text-xs uppercase tracking-wider text-slate-100">АГРО-КАДАСТР</h1>
          <p id="user-role-badge" class="text-[10px] text-emerald-400 font-semibold mt-0.5">Гість</p>
        </div>
      </div>
      <button onclick="handleLogout()" class="text-[10px] font-semibold bg-white/5 hover:bg-white/10 text-slate-300 px-2.5 py-1 rounded-lg border border-white/10 transition-colors">
        Вийти
      </button>
    </div>

    <!-- Аналітичні метрики -->
    <div class="grid grid-cols-2 gap-2 p-3 bg-black/20 border-b border-white/5 text-center">
      <div class="bg-slate-950/50 p-2.5 rounded-xl border border-white/5">
        <span class="block text-[9px] uppercase font-bold text-slate-400 tracking-wider">Обрано ділянок</span>
        <span id="stat-count" class="text-base font-extrabold text-slate-100">0</span>
      </div>
      <div class="bg-slate-950/50 p-2.5 rounded-xl border border-white/5">
        <span class="block text-[9px] uppercase font-bold text-slate-400 tracking-wider">Загальна площа</span>
        <span id="stat-area" class="text-base font-extrabold text-emerald-400">0.00 га</span>
      </div>
    </div>

    <!-- Фільтри та селектор року -->
    <div class="p-3.5 space-y-4 overflow-y-auto custom-scroll flex-1">
      
      <!-- Селектор року -->
      <div class="bg-slate-950/40 p-3 rounded-xl border border-white/5">
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-2 tracking-wider">📅 Сезон сівозміни</label>
        <select id="global-year-select" onchange="onYearChange(this.value)" class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-xs text-emerald-400 font-bold focus:outline-none focus:border-emerald-500/50 transition-colors">
          <option value="2024" selected>Сезон 2024</option>
          <option value="2023">Сезон 2023</option>
          <option value="2022">Сезон 2022</option>
        </select>
      </div>

      <!-- Легенда та фільтр за культурами -->
      <div>
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">🌾 Культури</span>
          <button onclick="toggleGroup('crop', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-bold">Обрати всі</button>
        </div>
        <div id="crop-filters" class="space-y-1.5"></div>
      </div>

      <div class="border-t border-white/5"></div>

      <!-- Фільтр за орендарями -->
      <div>
        <div class="flex items-center justify-between mb-2 px-1">
          <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">👤 Орендарі / Землекористувачі</span>
          <button onclick="toggleGroup('tenant', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-bold">Обрати всіх</button>
        </div>
        <div id="tenant-filters" class="space-y-1.5"></div>
      </div>

    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserRole = localStorage.getItem('user_role') || null;
    let currentSelectedYear = '2024';
    let userLocationMarker = null;

    // Авторизація
    function checkAuth() {
      if (!currentUserRole) {
        document.getElementById('login-modal').classList.remove('hidden');
      } else {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-role-badge').innerText = currentUserRole === 'admin' ? 'Адміністратор' : 'Користувач (Перегляд)';
      }
    }

    function handleLogin() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const err = document.getElementById('login-error');

      if (u === 'admin' && p === '8878') {
        currentUserRole = 'admin';
      } else if (u === 'user' && p === '1111') {
        currentUserRole = 'user';
      } else {
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      localStorage.setItem('user_role', currentUserRole);
      checkAuth();
      renderMap();
    }

    function handleLogout() {
      localStorage.removeItem('user_role');
      currentUserRole = null;
      checkAuth();
    }

    function toggleSidebar() {
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.toggle('translate-y-full');
      }
    }

    // Ініціалізація Карти
    const map = L.map('map', { zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      "Google Супутник": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    basemaps["Google Супутник"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    // Геолокація Google Maps
    function locateUser() {
      if (!navigator.geolocation) {
        alert('Геолокація не підтримується вашим браузером');
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        if (userLocationMarker) map.removeLayer(userLocationMarker);

        userLocationMarker = L.circleMarker([latitude, longitude], {
          radius: 8,
          fillColor: '#1A73E8',
          color: '#FFFFFF',
          weight: 3,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map).bindPopup('<b style="color:#0f172a;">Ви тут</b>').openPopup();

        map.setView([latitude, longitude], 17);
      }, (err) => {
        alert('Не вдалося отримати геопозицію. Перевірте, чи увімкнено GPS та надано дозвіл.');
      }, { enableHighAccuracy: true });
    }

    // Природна агро-палітра (Earthy Agro-Palette)
    const cropColors = {
      'соняшник': '#E2A854',  // Амброво-золотий
      'кукурудза': '#7A9A60',  // Оливково-зелений
      'гречка': '#5E8C6A',     // Шавлієвий
      'помідор': '#C66858',    // Теракотовий
      'малина': '#B85B74',     // Приглушено-ягідний
      'пшениця': '#D9C583',    // Солом'яний
      'просо': '#CBB778',      // Золотисто-піщаний
      'батат': '#A8795A',      // Каштановий
      'ріпак': '#E0BD4E',      // Сонячно-жовтий
      'соя': '#488B77'         // Смарагдово-полинний
    };

    const tenantColors = { 
      'Іван': '#60A5FA', 
      'Петро': '#F472B6', 
      'Василь': '#34D399', 
      'Назар': '#FB923C' 
    };
    
    const defaultPalette = ['#818CF8', '#38BDF8', '#34D399', '#FBBF24', '#F87171', '#A78BFA'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#94A3B8';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      checkAuth();
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) return console.error('Помилка завантаження даних:', error);

      rawGeoJson = data;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function getFieldDataByYear(properties, year) {
      const crop = (properties[`crop_${year}`] || properties.crop || 'інше').toLowerCase().trim();
      const tenant = (properties[`tenant_${year}`] || properties.area_ha || properties.орендар || '—').trim();
      return { crop, tenant };
    }

    function rebuildFilterValues() {
      activeCrops.clear();
      activeTenants.clear();

      rawGeoJson.features.forEach(f => {
        const { crop, tenant } = getFieldDataByYear(f.properties, currentSelectedYear);
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });
    }

    function onYearChange(newYear) {
      currentSelectedYear = newYear;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');
      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#8B93A0';
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-xl bg-slate-950/40 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all group';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${crop}" data-group="crop" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-white/20 focus:ring-0 focus:ring-offset-0">
            <span class="w-3 h-3 rounded-full transition-transform group-hover:scale-110" style="background-color: ${color}; box-shadow: 0 0 8px ${color}80;"></span>
            <span class="capitalize font-medium text-slate-200">${crop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-xl bg-slate-950/40 hover:bg-white/5 border border-white/5 cursor-pointer text-xs transition-all group';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${tenant}" data-group="tenant" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-white/20 focus:ring-0 focus:ring-offset-0">
            <span class="w-4 h-1 rounded-full transition-transform group-hover:scale-110" style="background-color: ${color}; box-shadow: 0 0 6px ${color}80;"></span>
            <span class="font-medium text-slate-200">${tenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => cb.addEventListener('change', syncFiltersAndRender));
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();
      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));
      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          const baseColor = cropColors[crop] || '#8B93A0';
          const strokeColor = getTenantColor(tenant);

          return {
            fillColor: baseColor,
            fillOpacity: 0.32,             /* Легка природна прозорість */
            color: strokeColor,             /* Колір межі за орендарем */
            weight: 1.8,                    /* Тонка межа */
            opacity: 0.9,
            className: 'agro-field-polygon' /* Додає тінь та ефект об'єму */
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;
          const fieldId = p.id || 'б/н';
          const areaNum = parseFloat(p.Площа) || 0;
          totalArea += areaNum;

          layer.on({
            click: () => {
              if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('translate-y-full');
            },
            mouseover: (e) => { 
              e.target.setStyle({ fillOpacity: 0.65, weight: 2.8, color: '#FFFFFF' }); 
            },
            mouseout: (e) => { 
              geojsonLayer.resetStyle(e.target); 
            }
          });

          layer.bindPopup(() => getPopupHTML(p, fieldId, areaNum), { maxWidth: 290 });
        }
      }).addTo(map);

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';
    }

    // Темне стильне вікно інспектора поля
    function getPopupHTML(properties, fieldId, areaNum, selectedYear = currentSelectedYear) {
      const { crop, tenant } = getFieldDataByYear(properties, selectedYear);
      const strokeColor = getTenantColor(tenant);
      const cropColor = cropColors[crop] || '#8B93A0';
      const isAdmin = currentUserRole === 'admin';

      return `
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
          <div style="background: rgba(255,255,255,0.05); padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 800; font-size: 11px; tracking: 0.05em; color: #f8fafc;">ДІЛЯНКА № ${fieldId}</span>
            <span style="background-color: ${cropColor}; color: #ffffff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: capitalize; box-shadow: 0 0 10px ${cropColor}80;">
              ${crop}
            </span>
          </div>

          <div style="padding: 14px; font-size: 11px; line-height: 1.6; color: #cbd5e1;">
            
            <div style="margin-bottom: 10px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);">
              <label style="font-size: 9px; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 4px;">Сезон сівозміни:</label>
              <select onchange="updatePopupYear(this, '${fieldId}')" style="width: 100%; font-weight: 700; font-size: 11px; padding: 4px 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: #0f172a; color: #34d399; outline: none;">
                <option value="2024" ${selectedYear === '2024' ? 'selected' : ''}>2024 рік</option>
                <option value="2023" ${selectedYear === '2023' ? 'selected' : ''}>2023 рік</option>
                <option value="2022" ${selectedYear === '2022' ? 'selected' : ''}>2022 рік</option>
              </select>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px;">
              <span style="color: #94a3b8; font-weight: 500;">Орендар:</span>
              ${isAdmin ? `
                <input id="edit-tenant-${fieldId}" type="text" value="${tenant}" style="width: 110px; text-align: right; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; border-radius: 4px; padding: 2px 4px;">
              ` : `
                <span style="font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 6px;">
                  <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block; box-shadow: 0 0 6px${strokeColor};"></span>
                  ${tenant}
                </span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px;">
              <span style="color: #94a3b8; font-weight: 500;">Культура:</span>
              ${isAdmin ? `
                <input id="edit-crop-${fieldId}" type="text" value="${crop}" style="width: 110px; text-align: right; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-size: 10px; border-radius: 4px; padding: 2px 4px;">
              ` : `
                <span style="font-weight: 700; color: #f8fafc; text-transform: capitalize;">${crop}</span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <span style="color: #94a3b8; font-weight: 500;">Площа:</span>
              <span style="font-weight: 800; color: #34d399; font-size: 12px;">${areaNum.toFixed(4)} га</span>
            </div>

            ${isAdmin ? `
              <button onclick="saveFieldEdits('${fieldId}', '${selectedYear}')" style="width: 100%; background: #10b981; color: #022c22; border: none; padding: 7px; border-radius: 8px; font-weight: 800; font-size: 10px; cursor: pointer; transition: all 0.2s;">
                💾 Зберегти зміни
              </button>
            ` : ''}

          </div>
        </div>
      `;
    }

    function updatePopupYear(selectEl, fieldId) {
      const selectedYear = selectEl.value;
      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (feature) {
        const areaNum = parseFloat(feature.properties.Площа) || 0;
        const popup = selectEl.closest('.leaflet-popup-content');
        popup.innerHTML = getPopupHTML(feature.properties, fieldId, areaNum, selectedYear);
      }
    }

    async function saveFieldEdits(fieldId, year) {
      const newTenant = document.getElementById(`edit-tenant-${fieldId}`).value.trim();
      const newCrop = document.getElementById(`edit-crop-${fieldId}`).value.trim();

      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (!feature) return;

      const updateData = {};
      if (year === '2024') {
        updateData.crop = newCrop;
        updateData.area_ha = newTenant;
      } else {
        updateData[`crop_${year}`] = newCrop;
        updateData[`tenant_${year}`] = newTenant;
      }

      const { error } = await supabaseClient.from('fields').update(updateData).eq('id', fieldId);

      if (error) {
        alert('Помилка збереження: ' + error.message);
      } else {
        alert('Зміни успішно збережено!');
        if (year === '2024') {
          feature.properties.crop = newCrop;
          feature.properties.area_ha = newTenant;
        } else {
          feature.properties[`crop_${year}`] = newCrop;
          feature.properties[`tenant_${year}`] = newTenant;
        }
        rebuildFilterValues();
        renderControls();
        renderMap();
      }
    }

    initApp();
  </script>
</body>
</html>
