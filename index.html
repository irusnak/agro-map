<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Агро-Кадастр — Геопортал з історією сівозміни</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
    #map { height: 100vh; width: 100vw; z-index: 1; background-color: #0b0f19; }
    
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 12px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 260px !important;
      max-width: 85vw !important;
      color: #0f172a !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }

    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #111827; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950">

  <!-- ВІКНО АВТОРИЗАЦІЇ -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-lg z-[3000] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20">
          🔒
        </div>
        <h2 class="text-xl font-bold text-slate-100">Вхід у геопортал</h2>
        <p class="text-xs text-slate-400 mt-1">Введіть логін та пароль для доступу</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Логін</label>
          <input type="text" id="auth-username" placeholder="admin або user" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Пароль</label>
          <input type="password" id="auth-password" placeholder="••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors">
        </div>
        <div id="login-error" class="hidden text-xs text-rose-400 text-center font-medium">Невірний логін або пароль!</div>
        <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition-all shadow-lg active:scale-98">
          Увійти
        </button>
      </div>
    </div>
  </div>

  <!-- Кнопка мобільної панелі -->
  <button id="mobile-toggle-btn" onclick="toggleSidebar()" class="md:hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[2000] bg-slate-900/95 text-emerald-400 border border-emerald-500/30 backdrop-blur-md px-5 py-2.5 rounded-full shadow-2xl font-semibold text-xs flex items-center gap-2 active:scale-95 transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
    <span>Панель управління</span>
  </button>

  <!-- Кнопка геолокації -->
  <button onclick="locateUser()" title="Моя геолокація" class="fixed top-4 left-4 md:left-88 z-[1000] bg-slate-900/90 border border-slate-700/80 hover:bg-slate-800 text-slate-200 p-2.5 rounded-xl shadow-xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center">
    📍
  </button>

  <!-- Панель управління -->
  <aside id="sidebar" class="fixed inset-x-2 bottom-0 max-h-[75vh] md:inset-auto md:top-4 md:left-4 z-[1000] md:w-80 md:max-h-[calc(100vh-32px)] bg-slate-900/95 backdrop-blur-md text-slate-200 rounded-t-2xl md:rounded-xl shadow-2xl border border-slate-800 flex flex-col overflow-hidden transition-transform duration-300 translate-y-full md:translate-y-0">
    
    <!-- Шапка -->
    <div class="p-3.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-500/20"></div>
        <div>
          <h1 class="font-bold text-xs uppercase tracking-wider text-slate-100">Агро-Кадастр</h1>
          <p id="user-role-badge" class="text-[10px] text-emerald-400 font-medium">Гість</p>
        </div>
      </div>
      <button onclick="handleLogout()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700 transition-colors">
        Вийти
      </button>
    </div>

    <!-- Метрики -->
    <div class="grid grid-cols-2 gap-2 p-3 bg-slate-900/60 border-b border-slate-800 text-center">
      <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800/80">
        <span class="block text-[9px] uppercase font-semibold text-slate-400">Обрано полів</span>
        <span id="stat-count" class="text-sm font-bold text-slate-100">0</span>
      </div>
      <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800/80">
        <span class="block text-[9px] uppercase font-semibold text-slate-400">Загальна площа</span>
        <span id="stat-area" class="text-sm font-bold text-emerald-400">0.00 га</span>
      </div>
    </div>

    <!-- Фільтри та селектор року -->
    <div class="p-3.5 space-y-4 overflow-y-auto custom-scroll flex-1">
      
      <!-- Селектор року -->
      <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5">📅 Обирайте сезон (Рік)</label>
        <select id="global-year-select" onchange="onYearChange(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-emerald-400 font-bold focus:outline-none">
          <option value="2024" selected>Сезон 2024</option>
          <option value="2023">Сезон 2023</option>
          <option value="2022">Сезон 2022</option>
        </select>
      </div>

      <!-- Фільтр за культурами -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold uppercase text-slate-300 tracking-wider">🌾 Культури</span>
          <button onclick="toggleGroup('crop', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-medium">Усі</button>
        </div>
        <div id="crop-filters" class="space-y-1"></div>
      </div>

      <div class="border-t border-slate-800/80"></div>

      <!-- Фільтр за орендарями -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold uppercase text-slate-300 tracking-wider">👤 Орендарі</span>
          <button onclick="toggleGroup('tenant', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-medium">Усі</button>
        </div>
        <div id="tenant-filters" class="space-y-1"></div>
      </div>

    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserRole = localStorage.getItem('user_role') || null;
    let currentSelectedYear = '2024';
    let userLocationMarker = null;

    // Вхід / Вихід
    function checkAuth() {
      if (!currentUserRole) {
        document.getElementById('login-modal').classList.remove('hidden');
      } else {
        document.getElementById('login-modal').classList.add('hidden');
        document.getElementById('user-role-badge').innerText = currentUserRole === 'admin' ? 'Адміністратор' : 'Користувач (Перегляд)';
      }
    }

    function handleLogin() {
      const u = document.getElementById('auth-username').value.trim();
      const p = document.getElementById('auth-password').value.trim();
      const err = document.getElementById('login-error');

      if (u === 'admin' && p === '8878') {
        currentUserRole = 'admin';
      } else if (u === 'user' && p === '1111') {
        currentUserRole = 'user';
      } else {
        err.classList.remove('hidden');
        return;
      }

      err.classList.add('hidden');
      localStorage.setItem('user_role', currentUserRole);
      checkAuth();
      renderMap();
    }

    function handleLogout() {
      localStorage.removeItem('user_role');
      currentUserRole = null;
      checkAuth();
    }

    function toggleSidebar() {
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.toggle('translate-y-full');
      }
    }

    // Карта
    const map = L.map('map', { zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const basemaps = {
      "Google Супутник": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }),
      "OpenStreetMap": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 })
    };
    basemaps["Google Супутник"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    // Геолокація
    function locateUser() {
      if (!navigator.geolocation) {
        alert('Геолокація не підтримується вашим браузером');
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        
        if (userLocationMarker) map.removeLayer(userLocationMarker);

        userLocationMarker = L.circleMarker([latitude, longitude], {
          radius: 9,
          fillColor: '#3B82F6',
          color: '#ffffff',
          weight: 3,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map).bindPopup('<b>Ви тут</b>').openPopup();

        map.setView([latitude, longitude], 16);
      }, () => {
        alert('Не вдалося отримати ваше місцерозташування.');
      });
    }

    // Палітри кольорів
    const cropColors = {
      'соняшник': '#D97706', 'кукурудза': '#4D7C0F', 'гречка': '#7C3AED',
      'помідор': '#C2410C', 'пшениця': '#CA8A04', 'ріпак': '#A16207', 'соя': '#15803D'
    };
    const tenantColors = { 'Іван': '#2563EB', 'Петро': '#DB2777', 'Василь': '#0D9488', 'Назар': '#EA580C' };
    const defaultPalette = ['#6366F1', '#06B6D4', '#10B981', '#F59E0B', '#EF4444'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#64748B';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      checkAuth();
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) return console.error('Помилка завантаження:', error);

      rawGeoJson = data;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function getFieldDataByYear(properties, year) {
      // Підтримка полів виду: crop_2024, crop_2023 або дефолтного crop
      const crop = (properties[`crop_${year}`] || properties.crop || 'інше').toLowerCase().trim();
      const tenant = (properties[`tenant_${year}`] || properties.area_ha || properties.орендар || '—').trim();
      return { crop, tenant };
    }

    function rebuildFilterValues() {
      activeCrops.clear();
      activeTenants.clear();

      rawGeoJson.features.forEach(f => {
        const { crop, tenant } = getFieldDataByYear(f.properties, currentSelectedYear);
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });
    }

    function onYearChange(newYear) {
      currentSelectedYear = newYear;
      rebuildFilterValues();
      renderControls();
      renderMap();
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');
      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#64748B';
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-950/50 border border-slate-800 cursor-pointer text-xs text-slate-300';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${crop}" data-group="crop" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-slate-700">
            <span class="w-2.5 h-2.5 rounded-sm" style="background-color: ${color}"></span>
            <span class="capitalize font-medium text-slate-200">${crop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-950/50 border border-slate-800 cursor-pointer text-xs text-slate-300';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${tenant}" data-group="tenant" checked class="w-4 h-4 text-emerald-500 rounded bg-slate-900 border-slate-700">
            <span class="w-3.5 h-1 rounded" style="background-color: ${color}"></span>
            <span class="font-medium text-slate-200">${tenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => cb.addEventListener('change', syncFiltersAndRender));
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();
      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));
      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const { crop, tenant } = getFieldDataByYear(feature.properties, currentSelectedYear);
          return {
            fillColor: cropColors[crop] || '#64748B',
            fillOpacity: 0.4,
            color: getTenantColor(tenant),
            weight: 2,
            opacity: 0.95
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;
          const fieldId = p.id || 'б/н';
          const areaNum = parseFloat(p.Площа) || 0;
          totalArea += areaNum;

          layer.on({
            click: () => {
              if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('translate-y-full');
            },
            mouseover: (e) => { e.target.setStyle({ fillOpacity: 0.65, weight: 3, color: '#ffffff' }); },
            mouseout: (e) => { geojsonLayer.resetStyle(e.target); }
          });

          // Генерація вмісту Popup
          layer.bindPopup(() => getPopupHTML(p, fieldId, areaNum), { maxWidth: 280 });
        }
      }).addTo(map);

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';
    }

    // Вміст вспливаючого вікна з перемикачем років та можливістю редагування для ADMIN
    function getPopupHTML(properties, fieldId, areaNum, selectedYear = currentSelectedYear) {
      const { crop, tenant } = getFieldDataByYear(properties, selectedYear);
      const strokeColor = getTenantColor(tenant);
      const cropColor = cropColors[crop] || '#64748B';
      const isAdmin = currentUserRole === 'admin';

      return `
        <div style="background-color: #ffffff; color: #0f172a; font-family: 'Inter', sans-serif;">
          <div style="background-color: #0f172a; color: #ffffff; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 11px;">ДІЛЯНКА № ${fieldId}</span>
            <span style="background-color: ${cropColor}; color: #ffffff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-transform: capitalize;">
              ${crop}
            </span>
          </div>

          <div style="padding: 12px; font-size: 11px; line-height: 1.5;">
            
            <!-- Вибір року (Історія) -->
            <div style="margin-bottom: 8px; background-color: #f8fafc; padding: 6px; border-radius: 6px; border: 1px solid #e2e8f0;">
              <label style="font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 3px;">Історія за рік:</label>
              <select onchange="updatePopupYear(this, '${fieldId}')" style="width: 100%; font-weight: 600; font-size: 11px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px;">
                <option value="2024" ${selectedYear === '2024' ? 'selected' : ''}>2024 рік</option>
                <option value="2023" ${selectedYear === '2023' ? 'selected' : ''}>2023 рік</option>
                <option value="2022" ${selectedYear === '2022' ? 'selected' : ''}>2022 рік</option>
              </select>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #f1f5f9; padding-bottom: 3px;">
              <span style="color: #64748b; font-weight: 500;">Орендар:</span>
              ${isAdmin ? `
                <input id="edit-tenant-${fieldId}" type="text" value="${tenant}" style="width: 100px; text-align: right; border: 1px solid #cbd5e1; font-size: 10px; border-radius: 3px; padding: 1px 3px;">
              ` : `
                <span style="font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 5px;">
                  <span style="width: 7px; height: 7px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block;"></span>
                  ${tenant}
                </span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #f1f5f9; padding-bottom: 3px;">
              <span style="color: #64748b; font-weight: 500;">Культура:</span>
              ${isAdmin ? `
                <input id="edit-crop-${fieldId}" type="text" value="${crop}" style="width: 100px; text-align: right; border: 1px solid #cbd5e1; font-size: 10px; border-radius: 3px; padding: 1px 3px;">
              ` : `
                <span style="font-weight: 600; color: #0f172a; text-transform: capitalize;">${crop}</span>
              `}
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
              <span style="color: #64748b; font-weight: 500;">Площа:</span>
              <span style="font-weight: 700; color: #059669; font-size: 12px;">${areaNum.toFixed(4)} га</span>
            </div>

            ${isAdmin ? `
              <button onclick="saveFieldEdits('${fieldId}', '${selectedYear}')" style="width: 100%; background-color: #059669; color: white; border: none; padding: 6px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer;">
                💾 Зберегти зміни
              </button>
            ` : ''}

          </div>
        </div>
      `;
    }

    // Перемикання року всередині картки ділянки
    function updatePopupYear(selectEl, fieldId) {
      const selectedYear = selectEl.value;
      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (feature) {
        const areaNum = parseFloat(feature.properties.Площа) || 0;
        const popup = selectEl.closest('.leaflet-popup-content');
        popup.innerHTML = getPopupHTML(feature.properties, fieldId, areaNum, selectedYear);
      }
    }

    // Збереження даних у Supabase для ADMIN
    async function saveFieldEdits(fieldId, year) {
      const newTenant = document.getElementById(`edit-tenant-${fieldId}`).value.trim();
      const newCrop = document.getElementById(`edit-crop-${fieldId}`).value.trim();

      const feature = rawGeoJson.features.find(f => f.properties.id == fieldId);
      if (!feature) return;

      // Формуємо об'єкт оновлення залежно від обраного року
      const updateData = {};
      if (year === '2024') {
        updateData.crop = newCrop;
        updateData.area_ha = newTenant;
      } else {
        updateData[`crop_${year}`] = newCrop;
        updateData[`tenant_${year}`] = newTenant;
      }

      const { error } = await supabaseClient.from('fields').update(updateData).eq('id', fieldId);

      if (error) {
        alert('Помилка збереження: ' + error.message);
      } else {
        alert('Зміни успішно збережено в Supabase!');
        // Оновлюємо локальні дані
        if (year === '2024') {
          feature.properties.crop = newCrop;
          feature.properties.area_ha = newTenant;
        } else {
          feature.properties[`crop_${year}`] = newCrop;
          feature.properties[`tenant_${year}`] = newTenant;
        }
        rebuildFilterValues();
        renderControls();
        renderMap();
      }
    }

    initApp();
  </script>
