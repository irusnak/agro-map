<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Агро-Кадастр — Геоінформаційна Система</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    #map { height: 100vh; width: 100%; z-index: 1; background-color: #0b0f19; }
    
    /* Точне форматування Leaflet Popup без перекриттів */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 10px !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 240px !important;
      color: #0f172a !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }

    /* Кастомний скроллбар для панелі */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #111827; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="m-0 p-0 overflow-hidden bg-slate-950">

  <!-- Панель управління ГІС -->
  <aside class="absolute top-4 left-4 z-[1000] w-80 max-h-[calc(100vh-32px)] bg-slate-900/90 backdrop-blur-md text-slate-200 rounded-xl shadow-2xl border border-slate-800 flex flex-col overflow-hidden">
    
    <!-- Заголовок -->
    <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-500/20"></div>
        <div>
          <h1 class="font-bold text-xs uppercase tracking-wider text-slate-100">Агро-Кадастр</h1>
          <p class="text-[10px] text-slate-400">Векторний моніторинг полів</p>
        </div>
      </div>
    </div>

    <!-- Метрики -->
    <div class="grid grid-cols-2 gap-2 p-3 bg-slate-900/60 border-b border-slate-800 text-center">
      <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800/80">
        <span class="block text-[9px] uppercase font-semibold text-slate-400">Обрано полів</span>
        <span id="stat-count" class="text-sm font-bold text-slate-100">0</span>
      </div>
      <div class="bg-slate-950/80 p-2 rounded-lg border border-slate-800/80">
        <span class="block text-[9px] uppercase font-semibold text-slate-400">Загальна площа</span>
        <span id="stat-area" class="text-sm font-bold text-emerald-400">0.00 га</span>
      </div>
    </div>

    <!-- Список фільтрів -->
    <div class="p-3.5 space-y-4 overflow-y-auto custom-scroll flex-1">
      
      <!-- Фільтр за культурами -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold uppercase text-slate-300 tracking-wider">🌾 Культури (Заповнення)</span>
          <button onclick="toggleGroup('crop', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-medium">Усі</button>
        </div>
        <div id="crop-filters" class="space-y-1"></div>
      </div>

      <div class="border-t border-slate-800/80"></div>

      <!-- Фільтр за орендарями -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-bold uppercase text-slate-300 tracking-wider">👤 Орендарі (Межа)</span>
          <button onclick="toggleGroup('tenant', true)" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-medium">Усі</button>
        </div>
        <div id="tenant-filters" class="space-y-1"></div>
      </div>

    </div>
  </aside>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwojstekgkmlrebpsbxl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EKyY2G-Rj-AiDpJsP8q7Sw_NDuMtmf6';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map('map', { zoomControl: false }).setView([48.3, 25.9], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Карт-основи високої роздільної здатності
    const basemaps = {
      "Google Супутник (Гібрид)": L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' }),
      "Google Супутник (Чистий)": L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' }),
      "OpenStreetMap (Вектор)": L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
      "Темна ГІС Подложка": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© CARTO' })
    };

    basemaps["Google Супутник (Гібрид)"].addTo(map);
    L.control.layers(basemaps, null, { position: 'topright' }).addTo(map);

    // Елегантна приглушена агрономічна палітра для культур
    const cropColors = {
      'соняшник': '#D97706',  // Теплий бурштин
      'кукурудза': '#4D7C0F',  // Природний оливково-зелений
      'гречка': '#7C3AED',     // Матовий слива-лаванда
      'помідор': '#C2410C',    // Приглушена теракота
      'пшениця': '#CA8A04',    // Пшенично-золотистий
      'ріпак': '#A16207',      // Глибокий гірчичний
      'соя': '#15803D'         // Лісовий зелений
    };

    // Строга контрастна палітра для меж орендарів
    const tenantColors = {
      'Іван': '#2563EB',       // Королівський синій
      'Петро': '#DB2777',      // М'який кармін
      'Василь': '#0D9488',     // Темний бірюзовий
      'Назар': '#EA580C'       // Мідний
    };
    const defaultPalette = ['#6366F1', '#06B6D4', '#10B981', '#F59E0B', '#EF4444'];
    let tenantIdx = 0;

    function getTenantColor(tenant) {
      if (!tenant || tenant === '—') return '#64748B';
      if (!tenantColors[tenant]) {
        tenantColors[tenant] = defaultPalette[tenantIdx % defaultPalette.length];
        tenantIdx++;
      }
      return tenantColors[tenant];
    }

    let rawGeoJson = null;
    let geojsonLayer = null;
    let activeCrops = new Set();
    let activeTenants = new Set();

    async function initApp() {
      const { data, error } = await supabaseClient.rpc('get_fields_geojson');
      if (error) {
        console.error('Помилка завантаження даних:', error);
        return;
      }

      rawGeoJson = data;

      rawGeoJson.features.forEach(f => {
        const crop = (f.properties.crop || 'інше').toLowerCase().trim();
        const tenant = (f.properties.area_ha || f.properties.орендар || '—').trim();
        activeCrops.add(crop);
        activeTenants.add(tenant);
      });

      renderControls();
      renderMap();
    }

    function renderControls() {
      const cropBox = document.getElementById('crop-filters');
      const tenantBox = document.getElementById('tenant-filters');

      cropBox.innerHTML = '';
      tenantBox.innerHTML = '';

      activeCrops.forEach(crop => {
        const color = cropColors[crop] || '#64748B';
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-950/50 border border-slate-800/80 hover:border-slate-700 cursor-pointer text-xs text-slate-300 transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${crop}" data-group="crop" checked class="w-3.5 h-3.5 text-emerald-500 rounded bg-slate-900 border-slate-700 focus:ring-0">
            <span class="w-2.5 h-2.5 rounded-sm" style="background-color: ${color}"></span>
            <span class="capitalize font-medium text-slate-200">${crop}</span>
          </div>
        `;
        cropBox.appendChild(label);
      });

      activeTenants.forEach(tenant => {
        const color = getTenantColor(tenant);
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 rounded-lg bg-slate-950/50 border border-slate-800/80 hover:border-slate-700 cursor-pointer text-xs text-slate-300 transition-all';
        label.innerHTML = `
          <div class="flex items-center gap-2.5">
            <input type="checkbox" value="${tenant}" data-group="tenant" checked class="w-3.5 h-3.5 text-emerald-500 rounded bg-slate-900 border-slate-700 focus:ring-0">
            <span class="w-3.5 h-1 rounded" style="background-color: ${color}"></span>
            <span class="font-medium text-slate-200">${tenant}</span>
          </div>
        `;
        tenantBox.appendChild(label);
      });

      document.querySelectorAll('input[data-group]').forEach(cb => {
        cb.addEventListener('change', syncFiltersAndRender);
      });
    }

    function syncFiltersAndRender() {
      activeCrops.clear();
      activeTenants.clear();

      document.querySelectorAll('input[data-group="crop"]:checked').forEach(cb => activeCrops.add(cb.value));
      document.querySelectorAll('input[data-group="tenant"]:checked').forEach(cb => activeTenants.add(cb.value));

      renderMap();
    }

    function toggleGroup(group, check) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach(cb => cb.checked = check);
      syncFiltersAndRender();
    }

    function renderMap() {
      if (geojsonLayer) map.removeLayer(geojsonLayer);

      let visibleCount = 0;
      let totalArea = 0;

      geojsonLayer = L.geoJSON(rawGeoJson, {
        filter: (feature) => {
          const crop = (feature.properties.crop || 'інше').toLowerCase().trim();
          const tenant = (feature.properties.area_ha || feature.properties.орендар || '—').trim();
          return activeCrops.has(crop) && activeTenants.has(tenant);
        },
        style: (feature) => {
          const p = feature.properties;
          const crop = (p.crop || '').toLowerCase().trim();
          const tenant = (p.area_ha || p.орендар || '—').trim();

          return {
            fillColor: cropColors[crop] || '#64748B',
            fillOpacity: 0.35,                   // Матова прозорість заливки
            color: getTenantColor(tenant),        // Витончений контур межі
            weight: 2,                           // Чітка товщина лінії
            opacity: 0.95
          };
        },
        onEachFeature: (feature, layer) => {
          visibleCount++;
          const p = feature.properties;

          const tenant = p.area_ha || '—';
          const areaNum = parseFloat(p.Площа) || 0;
          totalArea += areaNum;

          const crop = p.crop || '—';
          const fieldId = p.id || 'б/н';

          const strokeColor = getTenantColor(tenant);
          const cropColor = cropColors[crop.toLowerCase()] || '#64748B';

          // Ефект фокусування при наведенні
          layer.on({
            mouseover: (e) => {
              const l = e.target;
              l.setStyle({ fillOpacity: 0.60, weight: 3, color: '#ffffff' });
              l.bringToFront();
            },
            mouseout: (e) => {
              geojsonLayer.resetStyle(e.target);
            }
          });

          // Спливаюче віконце з Культурою замість Периметра
          layer.bindPopup(`
            <div style="background-color: #ffffff; color: #0f172a; font-family: 'Inter', sans-serif;">
              <div style="background-color: #0f172a; color: #ffffff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b;">
                <span style="font-weight: 700; font-size: 12px; letter-spacing: 0.5px;">ДІЛЯНКА № ${fieldId}</span>
                <span style="background-color: ${cropColor}; color: #ffffff; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: capitalize;">
                  ${crop}
                </span>
              </div>
              <div style="padding: 12px 14px; font-size: 12px; line-height: 1.6;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px;">
                  <span style="color: #64748b; font-weight: 500;">Орендар:</span>
                  <span style="font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 6px;">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${strokeColor}; display: inline-block;"></span>
                    ${tenant}
                  </span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px;">
                  <span style="color: #64748b; font-weight: 500;">Культура:</span>
                  <span style="font-weight: 600; color: #0f172a; text-transform: capitalize;">${crop}</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                  <span style="color: #64748b; font-weight: 500;">Площа:</span>
                  <span style="font-weight: 700; color: #059669; font-size: 13px;">${areaNum.toFixed(4)} га</span>
                </div>
              </div>
            </div>
          `);
        }
      }).addTo(map);

      document.getElementById('stat-count').innerText = visibleCount;
      document.getElementById('stat-area').innerText = totalArea.toFixed(2) + ' га';

      if (geojsonLayer.getBounds().isValid() && visibleCount > 0) {
        map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40] });
      }
    }

    initApp();
  </script>
</body>
</html>
